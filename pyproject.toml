[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-compute-relay"
version = "0.1.0"
description = "校園 GPU 任務共享平台"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "pillow>=11,<13"]

[project.optional-dependencies]
deploy = ["cryptography>=46,<47"]
dev = ["pytest>=8,<10"]
agent = ["nvidia-ml-py>=12,<14", "psutil>=6,<8"]

[project.scripts]
relay-server = "relay.cli:main"
relay-agent = "agent.main:main"

[tool.setuptools.packages.find]
include = ["relay*", "agent*"]

[tool.setuptools.package-data]
relay = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
