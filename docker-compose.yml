services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: powershare
      POSTGRES_PASSWORD: powershare
      POSTGRES_DB: powershare
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://powershare:powershare@db:5432/powershare
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  db_data:
