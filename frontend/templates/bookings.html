{% extends "base.html" %}
{% load static %}

{% block title %}我的預約{% endblock %}

{% block content %}
<section>
  <h1>新增預約</h1>
  <form id="booking-form">
    <label>機台 <select name="machine_id" required></select></label>
    <label>開始時間 <input type="datetime-local" name="start_time" required></label>
    <label>結束時間 <input type="datetime-local" name="end_time" required></label>
    <button type="submit">送出預約</button>
  </form>
</section>

<section>
  <h2>我的預約</h2>
  <div id="booking-list"></div>
</section>

<section>
  <h2>使用報告</h2>
  <div id="usage-report"></div>
</section>
{% endblock %}

{% block scripts %}
<script type="module" src="{% static 'js/bookings.js' %}"></script>
{% endblock %}
