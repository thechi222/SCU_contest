{% load static %}<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | PowerShare</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'index' %}">PowerShare</a>
    {% block nav %}
    <nav class="site-nav">
      <a href="{% url 'index' %}">工作台</a>
      <a href="{% url 'nodes' %}">我的設備</a>
      <a href="{% url 'assistant' %}">AI 助理</a>
      <a href="{% url 'display' %}">大螢幕</a>
    </nav>
    <div id="current-user"></div>
    {% endblock %}
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  {% block auth_script %}
  <script type="module" src="{% static 'js/auth.js' %}"></script>
  {% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
