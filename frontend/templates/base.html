{% load static %}<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | PowerShare</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'index' %}">PowerShare</a>
    <nav class="site-nav">
      <a href="{% url 'index' %}">機台列表</a>
      <a href="{% url 'bookings' %}">我的預約</a>
      <a href="{% url 'assistant' %}">AI 助理</a>
    </nav>
    <div id="identity-switcher"></div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script type="module" src="{% static 'js/auth.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
